<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>poToProno</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0f14;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .container {
      max-width: 720px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 20px;
      color: #c8d0da;
      line-height: 1.5;
      margin-bottom: 40px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    a {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
    }

    .primary {
      background: white;
      color: #0b0f14;
    }

    .secondary {
      border: 1px solid #59636f;
      color: white;
    }

    footer {
      margin-top: 55px;
      color: #7f8995;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>poToProno</h1>

    <p class="subtitle">
      Pronostique les matchs, défie tes amis et grimpe dans les classements.
      <br>
      Simple, gratuit et sans paris d'argent.
    </p>

    <div class="buttons">
      <a class="primary" href="support.html">
        Assistance
      </a>

      <a class="secondary" href="privacy.html">
        Politique de confidentialité
      </a>
    </div>

    <footer>
      © 2026 poToProno. Tous droits réservés.
    </footer>

  </main>

</body>
</html>
